<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Someone Special 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Canvas for Fruit Ninja Trail -->
  <canvas id="trail-canvas"></canvas>

  <!-- Landing Overlay Screen -->
  <div id="welcome-screen">
    <div class="welcome-box">
      <h2>Welcome 💖</h2>
      <p><b>Click below to enter your surprise</b></p>
      <button id="enter-btn" onclick="startExperience()">Enter ✨</button>
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="bg-music" loop>
    <source src="romantic-sound.mp3" type="audio/mpeg">
  </audio>

  <!-- Mute/Unmute Toggle Button -->
  <button id="mute-btn" onclick="toggleAudio()" style="display: none;">🔊</button>

  <!-- Main Card Container -->
  <div class="card">
    <div class="character-container">
      <img id="live-character" src="scarlet-jump.gif" alt="Cute Character">
    </div>
    
    <h1 id="greeting">Hi there! 👋</h1>
    
    <!-- Default Main Typewriter Display Area -->
    <div class="type-wrap">
      <span id="typewriter" class="typed-text"></span>
    </div>

    <!-- 2nd Custom Separated Typewriter Display Area -->
    <div id="custom-type-wrap" class="type-wrap custom-wrap" style="display: none;">
      <span id="custom-typewriter" class="typed-text custom-text"></span>
    </div>

    <!-- Hidden Static Paragraph -->
    <p id="message" style="display: none;"></p>
    
    <button id="main-btn" onclick="firstInteraction()">Click Me! ✨</button>

    <!-- Testing Box Section -->
    <div class="test-box-container">
      <input type="text" id="custom-text-input" placeholder="Type new phrase to test...">
      <button onclick="addCustomPhrase()">Add Text 🚀</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
