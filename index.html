<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Someone Special 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Canvas for Trail -->
  <canvas id="trail-canvas"></canvas>

  <!-- Landing Overlay Screen -->
  <div id="welcome-screen">
    <div class="welcome-box">
      <h2>Welcome 💌</h2>
      <p><b>Click below to enter your surprise</b></p>
      <button id="enter-btn" onclick="startExperience()">Enter ✨</button>
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="bg-music" loop>
    <source src="romantic-sound.mp3" type="audio/mpeg">
  </audio>

  <!-- Mute/Unmute Toggle Button -->
  <button id="mute-btn" onclick="toggleAudio()" style="display: none;">🔊</button>

  <!-- Main Card Container -->
  <div class="card" id="main-card">
    <div class="character-container">
      <img id="live-character" src="scarlet-jump.gif" alt="Cute Character">
    </div>
    
    <h1 id="greeting">Hi there! 😊</h1>
    
    <!-- Typewriter Display -->
    <div class="type-wrap">
      <span id="typewriter" class="typed-text"></span>
    </div>

    <button id="main-btn" onclick="firstInteraction()">Click Me! ✨</button>
  </div>

  <!-- 2nd Page: Love Locker Screen (Calendar Based) -->
  <div id="proposal-screen" class="proposal-overlay" style="display: none;">
    <div class="letter-box">
      <button class="close-btn" onclick="closeProposal()">×</button>
      
      <div class="letter-header" style="font-size: 1.5rem; font-weight: 600; color: #ff4b2b; margin-bottom: 10px;">🔒 Love Locker</div>
      <p class="letter-text" style="font-size: 1.1rem; color: #444; margin-bottom: 20px;">
        enter ur birth date
      </p>
      
      <div class="proposal-buttons" style="flex-direction: column; gap: 15px;">
        <input type="date" id="birth-date-input" class="calendar-input">
        <button id="unlock-btn" onclick="unlockLocker()">Unlock 💖</button>
      </div>
      <p id="locker-msg" style="margin-top: 15px; font-weight: bold;"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
